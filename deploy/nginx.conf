limit_req_zone $binary_remote_addr zone=booking:10m rate=5r/m;

# Initial HTTP bootstrap. Replace the domain at publication. Enable the HTTPS
# server below only after the real certificate has been issued.
server {
    listen 80;
    server_name _;
    client_max_body_size 16k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/appointment-requests {
        limit_req zone=booking burst=3 nodelay;
        proxy_pass http://web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
