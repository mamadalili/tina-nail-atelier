name: tina-atelier

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tina
      POSTGRES_USER: tina
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private .env file}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tina -d tina"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tina:${DB_PASSWORD}@db:5432/tina
    command: [npm, run, db:migrate]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tina:${DB_PASSWORD}@db:5432/tina
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    profiles: [notifications]
    build: { context: ., target: tools }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tina:${DB_PASSWORD}@db:5432/tina
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      web: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
